# Cloudflare Worker for the public ENTROTOPIA landing page.
# Keep this name the same as the Cloudflare Worker project name.
name = "entrotopia"
compatibility_date = "2026-11-06"

[assets]
directory = "./public"

# D1 connection. The current public site remains static until the backend is deployed.
[[d1_databases]]
binding = "DB"
database_name = "entrotopia-db"
database_id = "DEINE_D1_DATABASE_ID_HIER_EINTRAGEN"
migrations_dir = "migrations"
