  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 75% 15%,#293e6b 0,#0b1220 42%);color:#f7f9ff;padding:24px}.card{width:min(760px,100%);border:1px solid #33496d;border-radius:24px;padding:clamp(28px,7vw,70px);background:#101b2dcf;box-shadow:0 30px 90px #0008}.mark{display:grid;place-items:center;width:54px;height:54px;border-radius:14px;background:#dbe4ff;color:#182849;font-size:36px}small{display:block;margin-top:34px;color:#8ea0bf;letter-spacing:.15em;font-weight:800}h1{font-size:clamp(45px,9vw,83px);line-height:1;margin:14px 0;letter-spacing:-.055em}h1 span{color:#a7c0ff}p{color:#b8c5da;font-size:clamp(17px,2.5vw,22px);max-width:610px}.status{display:inline-flex;align-items:center;gap:9px;margin-top:25px;padding:9px 13px;border:1px solid #415778;border-radius:999px;color:#c9d5e8;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#e9b765}footer{margin-top:55px;border-top:1px solid #2b3b57;padding-top:21px;color:#8293af;font-size:13px}a{color:#b8cbff}
  </style>
</head>
<body><main class="card"><div class="mark">◈</div><small>ENTROTOPIA</small><h1>Etwas Neues<br><span>entsteht.</span></h1><p>ENTROTOPIA befindet sich im Aufbau. Diese Seite enthält derzeit kein Verkaufsangebot und nimmt keine Bestellungen entgegen.</p><div class="status"><i class="dot"></i> Entwicklung läuft</div><footer>Kontakt: <a href="mailto:kontakt@entrotopia.de">kontakt@entrotopia.de</a></footer></main></body>
</html>
