name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Site-Konsistenztest (Deployment-Eindeutigkeit, Verweise, Pflichtseiten)
        run: node tests/site.test.js
      - name: Lead-Tracking-Tests
        run: node tests/app.test.js
